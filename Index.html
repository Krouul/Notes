<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Заметки</title>
    
    <!-- PWA мета-теги -->
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Заметки">
    
    <!-- Подключение манифеста -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Иконки для iOS -->
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            min-height: 90vh;
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .auth-form {
            padding: 30px;
        }
        
        .auth-form h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
            touch-action: manipulation;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-danger {
            background: #ff4757;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .notes-container {
            padding: 20px;
            display: none;
        }
        
        .note-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        
        .note-card:active {
            background: #e9ecef;
            transform: scale(0.98);
        }
        
        .note-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .note-card p {
            color: #666;
            font-size: 14px;
        }
        
        .add-note-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            touch-action: manipulation;
        }
        
        .add-note-btn:active {
            transform: scale(0.9);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        
        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }
        
        .hidden {
            display: none;
        }
        
        .note-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .note-actions button {
            flex: 1;
        }
        
        @media (max-width: 600px) {
            .container {
                min-height: 100vh;
                border-radius: 0;
            }
            
            .btn {
                padding: 15px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Мои Заметки</h1>
        </div>
        
        <!-- Экран входа/регистрации -->
        <div id="authScreen" class="auth-form">
            <h2 id="authTitle">Вход в систему</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Имя пользователя">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль">
            </div>
            <button class="btn btn-primary" onclick="login()">Войти</button>
            <button class="btn btn-secondary" onclick="toggleAuth()">Создать аккаунт</button>
        </div>
        
        <!-- Экран заметок -->
        <div id="notesScreen" class="notes-container">
            <h2 id="welcomeMessage"></h2>
            <div id="notesList"></div>
            <button class="btn btn-danger" onclick="logout()">Выйти</button>
        </div>
        
        <!-- Кнопка добавления заметки -->
        <button class="add-note-btn hidden" id="addNoteBtn" onclick="showAddNoteModal()">+</button>
        
        <!-- Модальное окно для заметки -->
        <div class="modal" id="noteModal">
            <div class="modal-content">
                <h3 id="modalTitle">Новая заметка</h3>
                <div class="input-group">
                    <input type="text" id="noteTitle" placeholder="Заголовок">
                </div>
                <div class="input-group">
                    <textarea id="noteContent" placeholder="Текст заметки..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="saveNote()">Сохранить</button>
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-danger hidden" id="deleteBtn" onclick="deleteNote()">Удалить</button>
            </div>
        </div>
    </div>

    <script>
        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker зарегистрирован');
                    })
                    .catch(err => {
                        console.log('Ошибка регистрации Service Worker:', err);
                    });
            });
        }
        
        let currentUser = null;
        let isRegistering = false;
        let editingNoteId = null;
        
        // Загрузка данных из localStorage
        function loadUsers() {
            return JSON.parse(localStorage.getItem('users') || '{}');
        }
        
        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }
        
        function loadNotes(username) {
            return JSON.parse(localStorage.getItem(`notes_${username}`) || '[]');
        }
        
        function saveNotes(username, notes) {
            localStorage.setItem(`notes_${username}`, JSON.stringify(notes));
        }
        
        // Аутентификация
        function toggleAuth() {
            isRegistering = !isRegistering;
            document.getElementById('authTitle').textContent = 
                isRegistering ? 'Регистрация' : 'Вход в систему';
            document.querySelector('#authScreen .btn-primary').textContent = 
                isRegistering ? 'Зарегистрироваться' : 'Войти';
            document.querySelector('#authScreen .btn-secondary').textContent = 
                isRegistering ? 'У меня есть аккаунт' : 'Создать аккаунт';
        }
        
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert('Заполните все поля!');
                return;
            }
            
            const users = loadUsers();
            
            if (isRegistering) {
                if (users[username]) {
                    alert('Пользователь уже существует!');
                    return;
                }
                users[username] = { password: password };
                saveUsers(users);
                alert('Регистрация успешна! Теперь войдите.');
                toggleAuth();
                return;
            }
            
            if (!users[username] || users[username].password !== password) {
                alert('Неверное имя пользователя или пароль!');
                return;
            }
            
            currentUser = username;
            showNotesScreen();
        }
        
        function logout() {
            currentUser = null;
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('notesScreen').classList.add('hidden');
            document.getElementById('addNoteBtn').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
        
        function showNotesScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('notesScreen').classList.remove('hidden');
            document.getElementById('addNoteBtn').classList.remove('hidden');
            document.getElementById('welcomeMessage').textContent = `Привет, ${currentUser}!`;
            displayNotes();
        }
        
        // Работа с заметками
        function displayNotes() {
            const notes = loadNotes(currentUser);
            const notesList = document.getElementById('notesList');
            
            if (notes.length === 0) {
                notesList.innerHTML = '<p style="text-align: center; color: #666;">У вас пока нет заметок</p>';
                return;
            }
            
            notesList.innerHTML = notes.map(note => `
                <div class="note-card" onclick="editNote(${note.id})">
                    <h3>${note.title}</h3>
                    <p>${note.content.substring(0, 100)}${note.content.length > 100 ? '...' : ''}</p>
                    <small style="color: #999;">${new Date(note.created_at).toLocaleString()}</small>
                </div>
            `).join('');
        }
        
        function showAddNoteModal() {
            editingNoteId = null;
            document.getElementById('modalTitle').textContent = 'Новая заметка';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('deleteBtn').classList.add('hidden');
            document.getElementById('noteModal').style.display = 'flex';
        }
        
        function editNote(id) {
            editingNoteId = id;
            const notes = loadNotes(currentUser);
            const note = notes.find(n => n.id === id);
            
            document.getElementById('modalTitle').textContent = 'Редактировать заметку';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('deleteBtn').classList.remove('hidden');
            document.getElementById('noteModal').style.display = 'flex';
        }
        
        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            
            if (!title || !content) {
                alert('Заполните заголовок и текст!');
                return;
            }
            
            const notes = loadNotes(currentUser);
            
            if (editingNoteId) {
                const noteIndex = notes.findIndex(n => n.id === editingNoteId);
                notes[noteIndex].title = title;
                notes[noteIndex].content = content;
                notes[noteIndex].updated_at = new Date().toISOString();
            } else {
                notes.push({
                    id: Date.now(),
                    title: title,
                    content: content,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                });
            }
            
            saveNotes(currentUser, notes);
            closeModal();
            displayNotes();
        }
        
        function deleteNote() {
            if (!editingNoteId) return;
            
            if (confirm('Удалить эту заметку?')) {
                let notes = loadNotes(currentUser);
                notes = notes.filter(n => n.id !== editingNoteId);
                saveNotes(currentUser, notes);
                closeModal();
                displayNotes();
            }
        }
        
        function closeModal() {
            document.getElementById('noteModal').style.display = 'none';
        }
        
        // Закрытие модального окна при клике вне его
        document.getElementById('noteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // Обработка офлайн-режима
        window.addEventListener('online', () => {
            alert('Вы снова онлайн!');
        });
        
        window.addEventListener('offline', () => {
            alert('Вы офлайн. Заметки сохранены локально.');
        });
    </script>
</body>
</html>
