<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Офлайн - Заметки</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .offline-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            margin-bottom: 15px;
        }
        
        p {
            margin-bottom: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">📱</div>
        <h1>Вы офлайн</h1>
        <p>К сожалению, нет подключения к интернету.<br>
        Ваши заметки сохранены локально и будут доступны после подключения.</p>
        <button onclick="location.reload()" style="padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; background: white; color: #667eea;">
            Попробовать снова
        </button>
    </div>
</body>
</html>
